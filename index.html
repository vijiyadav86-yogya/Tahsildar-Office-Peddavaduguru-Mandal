<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahsildar Office, Peddavaduguru - Notice Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f4f8; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .card-box { border-radius: 16px; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.06); background: #ffffff; }
    .border-gold { border: 2px solid #f59e0b !important; }
    .btn-camera { background: #059669; color: white; border-radius: 10px; font-weight: 600; padding: 12px; }
    .btn-camera:hover { background: #047857; color: white; }
    .btn-pdf { background: #4338ca; color: white; border-radius: 10px; font-weight: 600; padding: 12px; }
    .btn-pdf:hover { background: #3730a3; color: white; }
    .btn-wa-direct { background: #25D366; color: white; font-size: 1.15rem; font-weight: bold; border-radius: 12px; padding: 14px; width: 100%; transition: all 0.2s; }
    .btn-wa-direct:hover { background: #1ebc59; color: white; transform: translateY(-1px); }
    #loginModal { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
  </style>
</head>
<body>

  <!-- 1. PIN Login Screen -->
  <div id="loginScreen" class="d-flex align-items-center justify-content-center min-vh-100 position-fixed w-100 top-0 start-0" style="z-index: 9999; background: #0f172a;">
    <div class="card p-4 p-md-5 text-center shadow-lg" style="max-width: 400px; width: 90%; border-radius: 20px;">
      <div class="mb-3">
        <i class="fa-solid fa-landmark text-success fa-3x"></i>
      </div>
      <h4 class="fw-bold mb-1">Welcome to Tahsildar Office</h4>
      <p class="text-muted small mb-4">పెద్దవడుగూరు రెవెన్యూ రికార్డ్స్ పోర్టల్</p>
      
      <div class="mb-3">
        <label class="form-label fw-bold small text-muted">ENTER SECURITY PIN</label>
        <input type="password" id="pinInput" class="form-control form-control-lg text-center fw-bold" placeholder="••••" maxlength="4" style="letter-spacing: 8px; font-size: 1.6rem;" autofocus>
      </div>
      <button class="btn btn-success btn-lg w-100 fw-bold" onclick="verifyPin()">
        లాగిన్ చేయండి <i class="fa-solid fa-arrow-right ms-2"></i>
      </button>
      <div id="pinError" class="text-danger small mt-2 fw-bold" style="display: none;">తప్పుడు పిన్! దయచేసి సరైన పిన్ నమోదు చేయండి.</div>
    </div>
  </div>

  <!-- 2. Main Portal Interface -->
  <div id="mainPortal" class="container py-4" style="max-width: 680px; display: none;">
    <div class="card card-box p-4 p-md-4">
      
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold text-dark m-0">కొత్త ఎంట్రీ & నోటీస్</h5>
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3" type="button" onclick="selectContact()">
          <i class="fa-solid fa-address-book me-1"></i> కాంటాక్ట్ ఎంచుకో
        </button>
      </div>

      <form id="revenueForm">
        <!-- విభాగం -->
        <div class="p-3 mb-3 rounded-3 border-gold" style="background: #fffbeb;">
          <label class="form-label fw-bold text-dark mb-1">
            <i class="fa-solid fa-list-check text-warning me-1"></i> విభాగం ఎంచుకోండి (Category) *
          </label>
          <select id="category" class="form-select form-select-lg fw-semibold" required>
            <option value="">-- ఎంచుకోండి (Select Category) --</option>
            <option value="1. Mutations (మ్యుటేషన్స్)">1. Mutations (మ్యుటేషన్స్)</option>
            <option value="2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)">2. PGRS (ప్రజా సమస్యల పరిష్కార వేదిక)</option>
            <option value="3. Mandala arjilu (మండల అర్జీలు)">3. Mandala arjilu (మండల అర్జీలు)</option>
            <option value="4. Others (ఇతరములు)">4. Others (ఇతరములు)</option>
          </select>
        </div>

        <!-- గ్రహీత పేరు -->
        <div class="mb-3">
          <label class="form-label fw-bold">గ్రహీత పేరు (Person Name) *</label>
          <input type="text" id="personName" class="form-control form-control-lg" placeholder="ఉదా: రాముడు / భూ యజమాని పేరు" required>
        </div>

        <!-- WhatsApp నంబర్ -->
        <div class="mb-3">
          <label class="form-label fw-bold">WhatsApp నంబర్ *</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text fw-bold bg-light">+91</span>
            <input type="tel" id="phoneNumber" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" maxlength="10" required>
          </div>
        </div>

        <!-- రిఫరెన్స్ నంబర్ -->
        <div class="mb-3">
          <label class="form-label fw-bold">డాక్యుమెంట్ / రిఫరెన్స్ నంబర్ *</label>
          <input type="text" id="refNo" class="form-control form-control-lg" placeholder="ఉదా: F-8 నంబర్ / అర్జీ వివరాలు" required>
        </div>

        <!-- ఫైల్ అప్‌లోడ్ సెక్షన్ -->
        <div class="p-3 mb-3 rounded-3" style="background: #eff6ff; border: 1px dashed #3b82f6;">
          <label class="form-label fw-bold text-primary mb-2">
            <i class="fa-solid fa-camera me-1"></i> డాక్యుమెంట్ ఫోటో లేదా PDF జతచేయండి:
          </label>
          <input type="file" id="realFileInput" accept="image/*,application/pdf" style="display: none;" onchange="handleFilePicked(event)">
          
          <div class="row g-2">
            <div class="col-6">
              <button type="button" class="btn btn-camera w-100" onclick="triggerUpload('camera')">
                <i class="fa-solid fa-camera fa-lg d-block mb-1"></i> కెమెరా ఓపెన్ చేయి
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-pdf w-100" onclick="triggerUpload('file')">
                <i class="fa-solid fa-file-pdf fa-lg d-block mb-1"></i> PDF / ఫైల్స్
              </button>
            </div>
          </div>
          <div id="fileSelectedBadge" class="mt-2 text-success fw-bold small text-center" style="display: none;"></div>
        </div>

        <!-- గడువు తేదీ -->
        <div class="row g-2 mb-4">
          <div class="col-6">
            <label class="form-label fw-bold small">గడువు రోజులు మారు</label>
            <select id="dueDaysSelect" class="form-select" onchange="calcDueDate(this.value)">
              <option value="3" selected>3 రోజులు</option>
              <option value="7">7 రోజులు</option>
              <option value="15">15 రోజులు</option>
              <option value="30">30 రోజులు</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label fw-bold small">గడువు తేదీ (Due Date)</label>
            <input type="date" id="dueDate" class="form-control" required>
          </div>
        </div>

        <!-- Direct WhatsApp Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-wa-direct shadow">
          <i class="fa-brands fa-whatsapp fa-xl me-2"></i>వాట్సాప్‌లో డైరెక్ట్ పంపు (Send Document & Notice)
        </button>
        <div id="statusAlert" class="mt-3 text-center fw-bold" style="display: none;"></div>
      </form>
    </div>
  </div>

  <script>
    const GITHUB_REPO = "vijiyadav86-yogya/What-s-app-peddavadagur-mandal-";
    let selectedFileObj = null;

    // PIN Authentication
    function verifyPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === "1207") {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainPortal').style.display = 'block';
        calcDueDate(3);
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }

    // Auto Calculate Due Date
    function calcDueDate(days) {
      const date = new Date();
      date.setDate(date.getDate() + parseInt(days));
      document.getElementById('dueDate').value = date.toISOString().split('T')[0];
    }

    // File Trigger Handlers
    function triggerUpload(type) {
      const fi = document.getElementById('realFileInput');
      if (type === 'camera') {
        fi.setAttribute('capture', 'environment');
      } else {
        fi.removeAttribute('capture');
      }
      fi.click();
    }

    function handleFilePicked(e) {
      if (e.target.files && e.target.files[0]) {
        selectedFileObj = e.target.files[0];
        const badge = document.getElementById('fileSelectedBadge');
        badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> ఎంపిక చేయబడింది: ${selectedFileObj.name}`;
        badge.style.display = 'block';
      }
    }

    // Contact Picker API (Mobile browsers)
    async function selectContact() {
      if ('contacts' in navigator && 'select' in navigator.contacts) {
        try {
          const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (contacts.length > 0) {
            if (contacts[0].name && contacts[0].name[0]) document.getElementById('personName').value = contacts[0].name[0];
            if (contacts[0].tel && contacts[0].tel[0]) {
              let num = contacts[0].tel[0].replace(/\D/g, '');
              if (num.length > 10) num = num.slice(-10);
              document.getElementById('phoneNumber').value = num;
            }
          }
        } catch (err) {}
      } else {
        alert("మీ బ్రౌజర్ Contact Picker కి సపోర్ట్ చేయకపోతే నేరుగా నంబర్ టైప్ చేయండి.");
      }
    }

    // Upload File Directly (Catbox direct stream)
    async function uploadDocument(file) {
      if (!file) return "";
      try {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);
        const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
        if (res.ok) {
          const link = await res.text();
          return link.trim();
        }
      } catch (e) {
        console.error("File upload error:", e);
      }
      return "";
    }

    // Form Submit
    document.getElementById('revenueForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('statusAlert');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>పంపుతోంది... వేచి ఉండండి';
      alertBox.style.display = 'block';
      alertBox.className = 'mt-3 text-center fw-bold text-primary';
      alertBox.innerText = 'ఫైల్ ప్రాసెస్ చేయబడుతోంది...';

      let fileUrl = "";
      if (selectedFileObj) {
        fileUrl = await uploadDocument(selectedFileObj);
      }

      alertBox.innerText = 'వాట్సాప్‌కు నేరుగా పంపబడుతోంది...';

      const payload = {
        event_type: "send_notice",
        client_payload: {
          person_name: document.getElementById('personName').value,
          phone: document.getElementById('phoneNumber').value,
          category: document.getElementById('category').value,
          ref_no: document.getElementById('refNo').value,
          due_date: document.getElementById('dueDate').value,
          file_url: fileUrl
        }
      };

      try {
        await fetch(`https://api.github.com/repos/${GITHUB_REPO}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        alertBox.className = 'mt-3 text-center fw-bold text-success';
        alertBox.innerText = '✅ వాట్సాప్‌కు నోటీస్ & డాక్యుమెంట్ విజయవంతంగా పంపబడింది!';
        document.getElementById('revenueForm').reset();
        document.getElementById('fileSelectedBadge').style.display = 'none';
        selectedFileObj = null;
        calcDueDate(3);
      } catch (err) {
        alertBox.className = 'mt-3 text-center fw-bold text-danger';
        alertBox.innerText = '❌ పంపడంలో లోపం జరిగింది. మళ్ళీ ప్రయత్నించండి.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-brands fa-whatsapp fa-xl me-2"></i>వాట్సాప్‌లో డైరెక్ట్ పంపు (Send Document & Notice)';
      }
    });

    // Enter Key on PIN input triggers login
    document.getElementById('pinInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') verifyPin();
    });
  </script>
</body>
</html>
