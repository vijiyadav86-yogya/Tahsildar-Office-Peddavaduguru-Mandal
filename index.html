<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahsildar Office, Peddavaduguru</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-xl space-y-4">
        <!-- Main Form Card -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h1 class="text-base font-bold text-slate-800 text-center border-b pb-2">
                తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు
            </h1>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-600">గ్రహీత పేరు:</label>
                    <input type="text" id="recipientName" value="Vijay" class="w-full border rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-600">ఫోన్ నంబర్:</label>
                    <input type="text" id="recipientPhone" value="918688421131" class="w-full border rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-600">రిఫరెన్స్ వివరాలు:</label>
                    <input type="text" id="refDetails" value="568/2026" class="w-full border rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-600">గడువు తేది (Due Date):</label>
                    <input type="date" id="datePickerInput" value="2026-10-14" class="w-full border rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- PDF Link Input -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-600">PDF ఆన్‌లైన్ లింక్ (Direct URL):</label>
                <input type="text" id="pdfLinkInput" value="https://vijiyadav86-yogya.github.io/Tahsildar-Office-Peddavaduguru-Mandal/sample.pdf" class="w-full border rounded-lg p-2 text-xs bg-slate-50 outline-none focus:border-indigo-500">
            </div>

            <!-- Message Preview Box -->
            <div>
                <label class="block text-xs font-semibold mb-1 text-slate-600">అధికారిక నోటీస్ మెసేజ్ ప్రివ్యూ:</label>
                <textarea id="customMsg" rows="5" class="w-full border rounded-xl p-2.5 text-xs text-slate-700 bg-slate-50 leading-relaxed outline-none" readonly>
*తహసీల్దార్ కార్యాలయం, పెద్దవడుగూరు (Tahsildar Office, Peddavaduguru)*

నమస్కారం Vijay గారు,

మీకు 568/2026 సంబంధించిన ఫైల్ పరిశీలన నిమిత్తం పంపడమైనది.
                </textarea>
            </div>

            <!-- WhatsApp API Action Button -->
            <button type="button" id="sendBtn" onclick="sendWhatsAppNotice()" class="w-full bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow transition">
                <i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు
            </button>
        </div>

        <!-- Tracking Records Dashboard -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-700">ట్రాకింగ్ రికార్డులు</h2>
                <span id="pendingCount" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-bold">1 Pending</span>
            </div>
            
            <div id="recordList" class="space-y-3">
                <div class="border border-slate-200 rounded-xl p-3 bg-slate-50 text-xs">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-slate-800">Vijay <span class="bg-amber-100 text-amber-700 px-1 rounded text-[10px]">PGRS</span></span>
                        <span class="text-amber-600 font-semibold">పెండింగ్</span>
                    </div>
                    <div class="text-slate-500">+91 8688421131 | 568/2026</div>
                    <div class="text-slate-500 mt-1">గడువు: 1 రోజులు</div>
                    <div class="flex gap-2 mt-2">
                        <button class="bg-indigo-600 text-white px-2 py-1 rounded text-[11px]"><i class="fas fa-file-pdf"></i> PDF చూడు</button>
                        <button class="bg-amber-500 text-white px-2 py-1 rounded text-[11px]"><i class="fas fa-bell"></i> రిమైండ్</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Direct API Script -->
    <script>
    async function sendWhatsAppNotice() {
        const btn = document.getElementById("sendBtn");
        
        // 1. Meta Credentials (Mee dashboard nundi)
        const phoneNumberId = "1267591226446486"; 
        
        // Step 1 lo meeru copy chesina Meta Access Token ni kinda unna quote lo paste cheyandi:
        const accessToken = "PASTE_YOUR_ACCESS_TOKEN_HERE";

        // 2. Form details
        const recipientName = document.getElementById("recipientName").value.trim();
        let recipientPhone = document.getElementById("recipientPhone").value.trim().replace(/\D/g, '');
        const refDetails = document.getElementById("refDetails").value.trim();
        const pdfUrl = document.getElementById("pdfLinkInput").value.trim();

        if (!accessToken || accessToken === "EAAZA14CBZApZAMBSkgw9JgPEmwkumCVhEe8WcnQzmQ0Xu64i11LUQcEZBKrvo1ICKuLR2b1PkQ5lme1WCCSk4dtxUIbVb4claLp43TVJZCi9pnxQXprF1ggwxbTOMTcve0JxyQwpt22KEB8sEQuZBiTNgdxA9cxvGLSok5ZAavvZCe2kmEPGnXhGr3qe2Yk9XdEkbKZAd4E4NUMrZBc6aJTomWPxVnhugNCAmoulhrQy11kduYtFUWlq7kL4n4AZAGV9rvQDvfuZCM3nMDGakxO0mtZBTzB1p") {
            alert("Dayachesi code lo Mee Access Token ni paste cheyandi!");
            return;
        }

        if (!recipientPhone.startsWith("91")) {
            recipientPhone = "91" + recipientPhone;
        }

        // Button state change
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> పంపుతున్నాము...';

        // 3. WhatsApp Cloud API Payload (WhatsApp app open avvakunda background lo velladaniki)
        const payload = {
            messaging_product: "whatsapp",
            recipient_type: "individual",
            to: recipientPhone,
            type: "template",
            template: {
                name: "tahsildar_notice_pdf", // WhatsApp Manager lo meeru ichina template name
                language: {
                    code: "te" // Telugu aithe 'te', English aithe 'en_US'
                },
                components: [
                    {
                        type: "header",
                        parameters: [
                            {
                                type: "document",
                                document: {
                                    link: pdfUrl,
                                    filename: `Notice_${refDetails.replace('/', '_')}.pdf`
                                }
                            }
                        ]
                    },
                    {
                        type: "body",
                        parameters: [
                            {
                                type: "text",
                                text: recipientName
                            },
                            {
                                type: "text",
                                text: refDetails
                            }
                        ]
                    }
                ]
            }
        };

        try {
            const response = await fetch(`https://graph.facebook.com/v20.0/${phoneNumberId}/messages`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${accessToken}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                alert("నోటీస్ మరియు PDF వాట్సాప్ లో విజయవంతంగా వెళ్ళింది!");
                console.log("Success:", result);
            } else {
                console.error("Meta API Error:", result);
                alert("పంపిణీ విఫలమైంది: " + (result.error ? result.error.message : "Error vachindi"));
            }
        } catch (error) {
            console.error("Network Error:", error);
            alert("ఇంటర్నెట్ లేదా నెట్‌వర్క్ సమస్య ఎదురైంది.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fab fa-whatsapp text-xl"></i> వాట్సాప్‌లో అధికారిక నోటీస్ పంపు';
        }
    }
    </script>
</body>
</html>
